<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Bank / Vault Icon in Center -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Roof Triangle -->
    <polygon points="256,128 390,195 122,195"/>
    <rect x="110" y="195" width="292" height="14" rx="4"/>
    
    <!-- 4 Pillars -->
    <rect x="140" y="220" width="36" height="110" rx="6"/>
    <rect x="206" y="220" width="36" height="110" rx="6"/>
    <rect x="270" y="220" width="36" height="110" rx="6"/>
    <rect x="336" y="220" width="36" height="110" rx="6"/>

    <!-- Base -->
    <rect x="110" y="340" width="292" height="20" rx="6"/>
    <rect x="94" y="365" width="324" height="24" rx="8"/>
  </g>

  <!-- Growth / Rate Badge in Bottom-Right -->
  <g transform="translate(350, 350)">
    <circle cx="0" cy="0" r="64" fill="#10b981" stroke="#ffffff" stroke-width="8" filter="url(#shadow)"/>
    <polygon points="0,-32 26,14 -26,14" fill="#ffffff"/>
  </g>
</svg>
